{% extends 'base.html' %}
{% block supplier %}active{% endblock %}
{% block add_supplier_statement %}active{% endblock %}
{% block content %}
{% load static %}
<div class="content-wrapper">
  <section class="content">
    <br />
    <a href="{% url 'supplier:list_supplier' %}"
      ><button
        type="button"
        id="empolyee"
        class="btn btn-primary"
        id="load"
        data-loading-text="<i class='fa fa-circle-o-notch fa-spin'></i>Processing"
      >
        Supplier List
      </button></a
    >
    <br /><br /><br />
    <div class="content-panel">
      <div class="row">
        <div class="col-md-6 pull-left">
          <div class="box">
            <div>
                         <h3 class="text-center"><b>Add Statement</b></h3>
             
              <div class="panel-body">
                <form
                  class="form-horizontal add-ledger-form"
                  method="post"
                  enctype="multipart/form-data"
                >
                  <div class="form-group">
                    <div class="col-sm-12">
                      {% csrf_token %}
                      <label><strong>Name</strong></label>
                      <span class="name-error" style="color: red; display: none"
                        >this field is requried</span
                      >
                      <input
                        type="text"
                        class="form-control name"
                        name="supplier_name"
                        value="{{ supplier }}"
                        placeholder="{{ supplier}}"
                        readonly
                      /><br />
                      <label><strong>Supplier Amount</strong></label>
                      <span
                        class="father_name-error"
                        style="color: red; display: none"
                        >this field is requried</span
                      >
                      <input
                        type="text"
                        class="form-control father_name"
                        name="supplier_amount"
                        placeholder="Total Amount"
                      /><br />
                      <label><strong>Payment Amount</strong></label>
                      <span
                        class="mobile-error"
                        style="color: red; display: none"
                        >this field is requried</span
                      >
                      <input
                        type="text"
                        class="form-control mobile"
                        name="payment_amount"
                        placeholder="Payable Amount"
                      /><br />
                      <label><strong>description no</strong></label>
                      <input
                        type="text"
                        class="form-control mobile"
                        name="description"
                        placeholder="Description"
                      /><br />
                      <label><strong>Date</strong></label>
                      <input
                        type="date"
                        class="form-control mobile"
                        name="date"
                        placeholder="Date"
                      /><br />

                      <button
                        type="submit"
                        id="save"
                        class="btn btn-primary ledger-submit-btn"
                        style="float: right"
                        id="load"
                        data-loading-text="<i class='fa fa-circle-o-notch fa-spin'></i>Processing Order"
                      >
                        Save Statement
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

{% endblock %}
