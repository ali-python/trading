{% extends 'base.html' %}
{% block supplier %}active{% endblock %}
{% block add_supplier %}active{% endblock %}
{% block content %}
{% load staticfiles %}
<div class="content-wrapper">
  <section class="content">
    <br />
    <a href="#"
      ><button
        type="button"
        id="empolyee"
        class="btn btn-primary"
        id="load"
        data-loading-text="<i class='fa fa-circle-o-notch fa-spin'></i>Processing"
      >
        Supplier List
      </button></a
    >
    <br /><br /><br />
    <div class="content-panel">
      <div class="row">
        <div class="col-md-6 pull-left">
          <div class="box">
            <div>
              <h3 class="text-center">Add Supplier</h3>
              <div class="panel-body">
                <form
                  class="form-horizontal add-ledger-form"
                  action="{% url 'supplier:add_supplier' %}"
                  method="post"
                  autocomplete="off"
                >
                  <div class="form-group">
                    <div class="col-sm-12">
                      {% csrf_token %}
                      <label><strong>Name</strong></label>
                      <span class="name-error" style="color: red; display: none"
                        >this field is requried</span
                      >
                      <input
                        type="text"
                        class="form-control name"
                        name="name"
                        placeholder="Name"
                      /><br />
                      <label><strong>Address</strong></label>
                      <span
                        class="father_name-error"
                        style="color: red; display: none"
                        >this field is requried</span
                      >
                      <input
                        type="text"
                        class="form-control father_name"
                        name="address"
                        placeholder="Addreess"
                      /><br />
                      <label><strong>Mobile no</strong></label>
                      <input
                        type="text"
                        class="form-control mobile"
                        name="mobile_no"
                        placeholder="Mobile"
                      /><br />

                      <button
                        type="submit"
                        id="save"
                        class="btn btn-primary ledger-submit-btn"
                        style="float: right"
                        id="load"
                        data-loading-text="<i class='fa fa-circle-o-notch fa-spin'></i>Processing Order"
                      >
                        Save Supplier
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

{% endblock %}
